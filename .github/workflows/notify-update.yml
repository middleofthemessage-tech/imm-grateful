name: Text owner when the app updates

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel to publish
        run: sleep 100
      - name: Tell the live app to text the owner
        run: |
          curl -sS -X POST "https://imm-grateful.vercel.app/api/ping" \
            -H "Content-Type: application/json" \
            -d '{"reason":"deploy"}' || true
