<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#7A9E8A" />
  <title>Page not found · In the Middle of the [Mess]age</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <style>
    :root { --sage: #7A9E8A; --sage-dark: #5C7D6A; --text: #1A2820; --cream: #FBF6F0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(ellipse at 12% 0%, rgba(122, 158, 138, 0.22), transparent 46%),
        #e8e4dc;
      color: var(--text);
      text-align: center;
    }
    main {
      max-width: 420px;
      background: var(--cream);
      border-radius: 24px;
      padding: 28px 22px 32px;
      box-shadow: 0 16px 48px rgba(26, 40, 32, 0.12);
    }
    img { width: min(280px, 80vw); height: auto; border-radius: 16px; margin: 0 auto 18px; display: block; }
    h1 { font-size: 28px; font-weight: 600; margin-bottom: 10px; }
    p { font-family: system-ui, sans-serif; font-size: 15px; line-height: 1.5; color: #4A6058; margin-bottom: 22px; }
    a {
      display: inline-block;
      background: var(--sage-dark);
      color: #fff;
      text-decoration: none;
      font-family: system-ui, sans-serif;
      font-weight: 800;
      padding: 12px 18px;
      border-radius: 14px;
    }
  </style>
</head>
<body>
  <main>
    <img src="logo-main.jpg" alt="In the Middle of the [Mess]age" />
    <h1>This page wandered off</h1>
    <p>The messy middle is big enough already. Let’s get you back home.</p>
    <a href="/">Back to In the Middle of the [Mess]age</a>
  </main>
</body>
</html>
